name: Release APK

# 触发：推送 v* 标签，或手动触发（输入版本号）。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（例如 0.1.0）'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 私钥不入库：CI 从 Secrets 取 base64 解码为 app/kiba-release.jks。
      # 用 printf 避免 echo 追加换行导致 base64 污染；-i 忽略空白字符。
      - name: Decode keystore & detect store type
        run: |
          printf '%s' "${{ secrets.KIBA_KEYSTORE_BASE64 }}" | base64 -d -i > app/kiba-release.jks
          MAGIC=$(od -An -tx1 -N4 app/kiba-release.jks | tr -d ' \n')
          if [ "$MAGIC" = "feedfeed" ]; then
            echo "KIBA_KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
          else
            echo "KIBA_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          fi
          echo "keystore magic=$MAGIC type=$KIBA_KEYSTORE_TYPE size=$(stat -c%s app/kiba-release.jks)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KIBA_KEYSTORE_PASSWORD: ${{ secrets.KIBA_KEYSTORE_PASSWORD }}
          KIBA_KEY_ALIAS: ${{ secrets.KIBA_KEY_ALIAS }}
          KIBA_KEY_PASSWORD: ${{ secrets.KIBA_KEY_PASSWORD }}
          KIBA_KEYSTORE_TYPE: ${{ env.KIBA_KEYSTORE_TYPE }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=${TAG:-${{ github.event.inputs.version }}}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Kiba ${{ steps.ver.outputs.version }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
