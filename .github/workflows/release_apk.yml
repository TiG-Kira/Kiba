name: Release APK

# 触发：推送 v* 标签，或手动触发（输入版本号）。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（例如 0.1.0）'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 私钥不入库：CI 从 Secrets 取 base64 解码为 app/kiba-release.jks。
      # 用 printf 避免 echo 追加换行导致 base64 污染；-i 忽略空白字符。
      - name: Decode keystore & detect store type
        run: |
          printf '%s' "${{ secrets.KIBA_KEYSTORE_BASE64 }}" | base64 -d -i > app/kiba-release.jks
          MAGIC=$(od -An -tx1 -N4 app/kiba-release.jks | tr -d ' \n')
          if [ "$MAGIC" = "feedfeed" ]; then
            echo "KIBA_KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
          else
            echo "KIBA_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          fi
          echo "keystore magic=$MAGIC type=$KIBA_KEYSTORE_TYPE size=$(stat -c%s app/kiba-release.jks)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KIBA_KEYSTORE_PASSWORD: ${{ secrets.KIBA_KEYSTORE_PASSWORD }}
          KIBA_KEY_ALIAS: ${{ secrets.KIBA_KEY_ALIAS }}
          KIBA_KEYSTORE_TYPE: ${{ env.KIBA_KEYSTORE_TYPE }}
          KIBA_DF_CLIENT_ID: ${{ secrets.KIBA_DF_CLIENT_ID }}
          KIBA_DF_CLIENT_SECRET: ${{ secrets.KIBA_DF_CLIENT_SECRET }}
        run: |
          # PKCS12 强制 store 密码 == key 密码；用已验证可打开 store 的口令派生 key 口令，
          # 避免独立的 KIBA_KEY_PASSWORD 口令不一致导致 "Get Key failed / final block not properly padded"。
          if [ "$KIBA_KEYSTORE_TYPE" = "PKCS12" ]; then
            export KIBA_KEY_PASSWORD="$KIBA_KEYSTORE_PASSWORD"
          else
            export KIBA_KEY_PASSWORD="${{ secrets.KIBA_KEY_PASSWORD }}"
          fi
          echo "store type=$KIBA_KEYSTORE_TYPE"
          ./gradlew assembleRelease --no-daemon

      - name: Resolve version
        id: ver
        run: |
          # release 名称用去掉 v 前缀的版本号；tag_name 保留完整推送标签（带 v），避免重复打 tag
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Kiba ${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
