name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          KIBA_DF_CLIENT_ID: ${{ secrets.KIBA_DF_CLIENT_ID }}
          KIBA_DF_CLIENT_SECRET: ${{ secrets.KIBA_DF_CLIENT_SECRET }}
          KIBA_QR_GATEWAY_BASE: ${{ secrets.KIBA_QR_GATEWAY_BASE }}
          KIBA_QR_GATEWAY_SECRET: ${{ secrets.KIBA_QR_GATEWAY_SECRET }}
          KIBA_QR_GATEWAY_PATHS: ${{ secrets.KIBA_QR_GATEWAY_PATHS }}
          KIBA_LXNS_DEV_KEY: ${{ secrets.KIBA_LXNS_DEV_KEY }}
          KIBA_LXNS_CLIENT_ID: ${{ secrets.KIBA_LXNS_CLIENT_ID }}
          KIBA_LXNS_CLIENT_SECRET: ${{ secrets.KIBA_LXNS_CLIENT_SECRET }}
        run: ./gradlew assembleDebug --no-daemon
